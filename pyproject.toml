[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-evidence"
version = "0.1.0"
description = "Evidence-first security investigation system for Windows telemetry"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
sentinel-evidence = "sentinel_evidence.cli:main"

[tool.setuptools.package-data]
sentinel_evidence = ["db/schema.sql", "correlate/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
